[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lia"
version = "0.1.0"
description = "lia - Jarvis-like AI Voice Assistant for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
lia = "assistant.main:main"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
